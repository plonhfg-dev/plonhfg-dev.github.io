<!DOCTYPE html><html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hyderabadi Chicken Biryani Clicker</title>
<style>
body { margin:0; font-family:sans-serif; background:#0f172a; color:#e5e7eb; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { margin:20px; }
.stats { display:flex; gap:20px; margin-bottom:20px; }
.stat { background:#1e293b; padding:10px 20px; border-radius:10px; }
.pot { position:relative; width:220px; height:160px; margin:20px auto; cursor:pointer; }
.pot-body { width:100%; height:100%; background:radial-gradient(circle at 50% 30%, #facc15, #92400e); border-radius:0 0 110px 110px; border:5px solid #451a03; overflow:hidden; }
.pot-lid { position:absolute; top:-40px; left:10px; width:200px; height:50px; background:#78350f; border-radius:50% 50% 0 0; border:4px solid #451a03; }
.float { position:absolute; color:#fff; font-weight:bold; animation:floatUp .8s ease-out forwards; }
@keyframes floatUp { 0%{transform:translateY(0);opacity:1;} 100%{transform:translateY(-40px);opacity:0;} }
.btn { background:#1e293b; color:#e5e7eb; border:1px solid #475569; padding:6px 12px; margin:5px; border-radius:8px; cursor:pointer; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }
textarea { width:100%; height:80px; margin-top:10px; border-radius:8px; border:none; padding:8px; }
.upgrade-grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:20px; }
.upgrade-card { background:#1e293b; padding:10px; border-radius:10px; width:150px; text-align:center; }
</style>
</head>
<body>
<h1>🍛 Hyderabadi Chicken Biryani Clicker</h1>
<div class="stats">
  <div class="stat">Biryani: <span id="biryani">0</span></div>
  <div class="stat">Per Click: <span id="perClick">1</span></div>
  <div class="stat">Total Cooked: <span id="total">0</span></div>
</div>
<div class="pot" id="cookBtn">
  <div class="pot-lid"></div>
  <div class="pot-body"></div>
</div>
<div>
  <button class="btn" id="exportBtn">Export Save</button>
  <button class="btn" id="importBtn">Import Save</button>
  <button class="btn" id="resetBtn">Reset</button>
</div>
<textarea id="saveData" readonly placeholder="Save data will appear here when you export"></textarea>
<h2>Upgrades</h2>
<div class="upgrade-grid" id="upgrades"></div>
<script>
(function(){
const biryaniEl=document.getElementById('biryani');
const perClickEl=document.getElementById('perClick');
const totalEl=document.getElementById('total');
const cookBtn=document.getElementById('cookBtn');
const saveBox=document.getElementById('saveData');
const upgradesGrid=document.getElementById('upgrades');
let S=JSON.parse(localStorage.getItem('biryaniSave')||'null')||{biryani:0,perClick:1,total:0,upgrades:{}};
const UPG=[
  {id:'saffron',name:'Saffron',cost:50,add:1},
  {id:'ghee',name:'Ghee',cost:200,add:3},
  {id:'chicken',name:'Chicken',cost:1000,add:10}
];
function updateHUD(){
  biryaniEl.textContent=Math.floor(S.biryani);
  perClickEl.textContent=S.perClick;
  totalEl.textContent=Math.floor(S.total);
  localStorage.setItem('biryaniSave',JSON.stringify(S));
  renderUpgrades();
}
function floatText(txt){
  const span=document.createElement('div');
  span.className='float';
  span.textContent=txt;
  span.style.left=Math.random()*100+'px';
  span.style.top='60px';
  cookBtn.appendChild(span);
  setTimeout(()=>span.remove(),800);
}
cookBtn.addEventListener('click',()=>{
  S.biryani+=S.perClick;
  S.total+=S.perClick;
  floatText('+'+S.perClick);
  updateHUD();
});
document.getElementById('exportBtn').addEventListener('click',()=>{
  const data=btoa(JSON.stringify(S));
  saveBox.value=data;
  saveBox.select();
  document.execCommand('copy');
  alert('Save copied to clipboard!');
});
document.getElementById('importBtn').addEventListener('click',()=>{
  const code=prompt('Paste save code:');
  if(!code) return;
  try{S=JSON.parse(atob(code));updateHUD();}catch(e){alert('Invalid save');}
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('Reset everything?')){S={biryani:0,perClick:1,total:0,upgrades:{}};updateHUD();}
});
function renderUpgrades(){
  upgradesGrid.innerHTML='';
  UPG.forEach(u=>{
    const owned=S.upgrades[u.id]||0;
    const cost=Math.floor(u.cost*Math.pow(1.15,owned));
    const card=document.createElement('div');
    card.className='upgrade-card';
    card.innerHTML=`<div><strong>${u.name}</strong></div>
      <div>+${u.add} per click</div>
      <div>Owned: ${owned}</div>
      <div><button class='btn' ${S.biryani<cost?'disabled':''} data-id='${u.id}'>Buy (${cost})</button></div>`;
    upgradesGrid.appendChild(card);
  });
}
upgradesGrid.addEventListener('click',e=>{
  const btn=e.target.closest('button');
  if(!btn) return;
  const id=btn.getAttribute('data-id');
  const u=UPG.find(x=>x.id===id);
  const owned=S.upgrades[id]||0;
  const cost=Math.floor(u.cost*Math.pow(1.15,owned));
  if(S.biryani>=cost){
    S.biryani-=cost;
    S.upgrades[id]=owned+1;
    S.perClick+=u.add;
    updateHUD();
  }
});
updateHUD();
})();
</script>
</body>
</html>
