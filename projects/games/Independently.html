<!DOCTYPE html><html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hyderabadi Chicken Biryani Clicker</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root{
      --bg-1:#0f172a; /* slate-900 */
      --bg-2:#1e293b; /* slate-800 */
      --card:#111827; /* gray-900 */
      --accent:#f59e0b; /* amber-500 */
      --accent-2:#22c55e; /* green-500 */
      --accent-3:#60a5fa; /* blue-400 */
      --muted:#94a3b8; /* slate-400 */
      --text:#e5e7eb; /* gray-200 */
      --shadow: 0 20px 40px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(245,158,11,.10), transparent 60%),
        radial-gradient(1200px 600px at 10% 110%, rgba(96,165,250,.12), transparent 60%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }
    .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
    header{
      display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:18px
    }
    .title{
      display:flex;gap:12px;align-items:center
    }
    .title .emoji{font-size:34px;filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));}
    h1{margin:0;font-size:clamp(20px,3.5vw,34px);letter-spacing:.2px}.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}
@media (min-width:880px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:4px;min-height:64px
}
.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.stat .value{font-size:20px;font-variant-numeric:tabular-nums}

.layout{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media (min-width:980px){.layout{grid-template-columns: minmax(340px, 420px) 1fr}}

.pot-card, .panel{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.06);
  border-radius:20px;padding:18px;box-shadow:var(--shadow);
}

.pot{
  position:relative;display:grid;place-items:center;aspect-ratio:1/1;max-width:420px;margin:0 auto
}
.pot button{
  width:100%;height:100%;border:none;background:transparent;cursor:pointer;position:relative
}

/* Handi (pot) built with CSS */
.handi{
  position:relative;width:72%;aspect-ratio:1/1;border-radius:50%;
  background: radial-gradient(120% 90% at 50% 20%, #7c2d12, #431407);
  box-shadow: inset 0 -18px 40px rgba(0,0,0,.45), 0 28px 60px rgba(0,0,0,.45);
  transform: translateY(8%);
  transition: transform .06s ease;
}
.handi::before{ /* rim */
  content:"";position:absolute;inset:-10% -14% auto -14%;height:26%;border-radius:50%;
  background: radial-gradient(120% 120% at 50% 60%, #78350f, #451a03);
  box-shadow: inset 0 6px 10px rgba(255,255,255,.08), inset 0 -10px 20px rgba(0,0,0,.5);
}
.handi::after{ /* shine */
  content:"";position:absolute;left:16%;top:20%;width:22%;height:22%;border-radius:50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), rgba(255,255,255,0) 70%);
  filter: blur(2px);
}

.steam{
  position:absolute;top:6%;left:50%;width:2px;height:2px;pointer-events:none;
  filter: blur(.2px);
}
.steam span{
  position:absolute;bottom:-6px;left:-6px;width:12px;height:18px;border-radius:50% 50% 50% 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.7), rgba(255,255,255,0));
  opacity:.0;animation: rise 3.2s ease-in infinite;
}
.steam span:nth-child(2){left:20px;animation-delay:.6s}
.steam span:nth-child(3){left:-24px;animation-delay:1.2s}
.steam span:nth-child(4){left:10px;animation-delay:1.8s}
@keyframes rise{0%{transform:translate(-50%,30px) scale(.6);opacity:0}
  20%{opacity:.75}
  100%{transform:translate(-50%,-80px) scale(1.2);opacity:0}}

.click-amount{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none}
.float{position:absolute;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.5);opacity:0;animation:floatUp .8s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.9);opacity:0}
  10%{opacity:1}
  100%{transform:translate(-50%,-46px) scale(1);opacity:0}}

.handi:active{transform:translateY(12%) scale(.98)}

.action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{
  background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.12);color:var(--text);
  padding:8px 12px;border-radius:12px;cursor:pointer;transition:transform .05s ease, opacity .2s;
}
.btn:hover{opacity:.95}
.btn:active{transform:scale(.98)}
.btn.primary{border-color:rgba(245,158,11,.5);box-shadow:0 8px 20px rgba(245,158,11,.25)}
.btn.danger{border-color:rgba(239,68,68,.6)}

.panel h2{margin:0 0 10px;font-size:18px;letter-spacing:.2px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;
  justify-content:space-between;min-height:70px
}
.card .info{display:flex;gap:10px;align-items:center}
.card .icon{font-size:22px}
.card .name{font-weight:600}
.card .desc{font-size:12px;color:var(--muted)}
.card .cost{font-variant-numeric:tabular-nums;color:var(--accent)}
.card .owned{font-size:12px;color:var(--muted)}
.buy{margin-left:auto}
.buy[disabled]{opacity:.45;cursor:not-allowed}

footer{opacity:.7;margin-top:18px;font-size:12px;text-align:center}
a{color:var(--accent-3);text-decoration:none}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <div class="emoji" aria-hidden>🍛</div>
        <div>
          <h1>Hyderabadi <span style="color:var(--accent)">Chicken Biryani</span> Clicker</h1>
          <div style="color:var(--muted);font-size:13px">Cook biryani, buy upgrades, master the <em>dum</em>!</div>
        </div>
      </div>
      <div class="action-row">
        <button class="btn" id="saveBtn" title="Save (auto-saves too)">💾 Save</button>
        <button class="btn" id="exportBtn" title="Export your save data">📄 Export</button>
        <button class="btn" id="importBtn" title="Import save data">📥 Import</button>
        <button class="btn danger" id="resetBtn" title="Reset everything">♻️ Reset</button>
      </div>
    </header><section class="stats">
  <div class="stat"><div class="label">Biryani</div><div class="value" id="biryaniOut">0</div></div>
  <div class="stat"><div class="label">Per Click</div><div class="value" id="perClickOut">1</div></div>
  <div class="stat"><div class="label">Per Second</div><div class="value" id="perSecOut">0</div></div>
  <div class="stat"><div class="label">Total Cooked</div><div class="value" id="totalOut">0</div></div>
</section>

<section class="layout">
  <div class="pot-card">
    <div class="pot" aria-live="polite">
      <div class="steam" aria-hidden>
        <span></span><span></span><span></span><span></span>
      </div>
      <button id="cookBtn" aria-label="Cook biryani by tapping the handi">
        <div class="handi" id="handi"></div>
      </button>
      <div class="click-amount" id="floatLayer" aria-hidden></div>
    </div>
    <div class="action-row">
      <button class="btn primary" id="spiceBurstBtn" title="10s of double clicks (cost scales)">🌶️ Spice Burst</button>
      <span id="statusMsg" style="font-size:13px;color:var(--muted)"></span>
    </div>
  </div>

  <div class="panel">
    <h2>Upgrades & Ingredients</h2>
    <div class="grid" id="upgradesGrid"></div>
    <h2 style="margin-top:18px">Autocookers (Biryani Per Second)</h2>
    <div class="grid" id="autoGrid"></div>
  </div>
</section>

<footer>
  Made with ❤️ for biryani lovers. Tip: long press / hold to auto-click on some touch devices.
</footer>

  </div><script>
(function(){
  const el = (sel)=>document.querySelector(sel);
  const grid = (id)=>document.getElementById(id);
  const fmt = (n)=>{
    if (!isFinite(n)) return '∞';
    const abs = Math.abs(n);
    if(abs>=1e12) return (n/1e12).toFixed(2)+'T';
    if(abs>=1e9)  return (n/1e9).toFixed(2)+'B';
    if(abs>=1e6)  return (n/1e6).toFixed(2)+'M';
    if(abs>=1e3)  return (n/1e3).toFixed(2)+'K';
    return Math.floor(n).toString();
  };
  const currency = (n)=>`₹${fmt(n)}`;

  const defaultState = {
    biryani: 0,
    total: 0,
    perClick: 1,
    perSecond: 0,
    spiceBurstLevel: 0,
    upgrades: {},
    autos: {},
    lastTick: Date.now(),
    doubleClickUntil: 0
  };
  let S = load() || structuredClone(defaultState);

  // Content definitions
  const UPG = [
    {id:'saffron', name:'Kesar Saffron', icon:'🧡', base:50, type:'click', add:1, desc:'+1 per click'},
    {id:'ghee', name:'Neyyi Ghee', icon:'🧈', base:200, type:'click', add:3, desc:'+3 per click'},
    {id:'chicken', name:'Tender Chicken', icon:'🍗', base:1200, type:'click', add:12, desc:'+12 per click'},
    {id:'basmati', name:'Basmati Upgrade', icon:'🌾', base:5000, type:'click', add:50, desc:'+50 per click'},
    {id:'dum', name:'Perfect Dum', icon:'🔥', base:20000, type:'click', mult:1.5, desc:'×1.5 per click (multiplicative)'}
  ];

  const AUTOS = [
    {id:'helper', name:'Kitchen Helper', icon:'🧑\u200d🍳', base:60, bps:0.2, desc:'0.2/sec'},
    {id:'coal', name:'Charcoal Dum', icon:'🪵', base:500, bps:1, desc:'1/sec'},
    {id:'pressure', name:'Pressure Steam', icon:'🍲', base:3000, bps:6, desc:'6/sec'},
    {id:'bawarchi', name:'Master Bawarchi', icon:'🥘', base:15000, bps:28, desc:'28/sec'},
    {id:'foodtruck', name:'Biryani Truck', icon:'🚚', base:120000, bps:180, desc:'180/sec'}
  ];

  // DOM
  const biryaniOut = el('#biryaniOut');
  const totalOut = el('#totalOut');
  const perClickOut = el('#perClickOut');
  const perSecOut = el('#perSecOut');
  const cookBtn = el('#cookBtn');
  const floatLayer = el('#floatLayer');
  const statusMsg = el('#statusMsg');

  function upgradeCost(base, owned){
    // Gently increasing cost: base * 1.15^owned
    return Math.ceil(base * Math.pow(1.15, owned||0));
  }

  function renderUpgrades(){
    const g = grid('upgradesGrid');
    g.innerHTML = '';
    UPG.forEach(u=>{
      const owned = S.upgrades[u.id]||0;
      const cost = upgradeCost(u.base, owned);
      const card = document.createElement('div');
      card.className='card';
      card.innerHTML = `
        <div class="info">
          <div class="icon">${u.icon}</div>
          <div>
            <div class="name">${u.name}</div>
            <div class="desc">${u.desc} • <span class="owned">Owned: ${owned}</span></div>
          </div>
        </div>
        <div class="buy">
          <div class="cost">${currency(cost)}</div>
          <button class="btn" data-upg="${u.id}">Buy</button>
        </div>
      `;
      g.appendChild(card);
    });
  }

  function renderAutos(){
    const g = grid('autoGrid');
    g.innerHTML = '';
    AUTOS.forEach(a=>{
      const owned = S.autos[a.id]||0;
      const cost = upgradeCost(a.base, owned);
      const card = document.createElement('div');
      card.className='card';
      card.innerHTML = `
        <div class="info">
          <div class="icon">${a.icon}</div>
          <div>
            <div class="name">${a.name}</div>
            <div class="desc">${a.desc} • <span class="owned">Owned: ${owned}</span></div>
          </div>
        </div>
        <div class="buy">
          <div class="cost">${currency(cost)}</div>
          <button class="btn" data-auto="${a.id}">Buy</button>
        </div>
      `;
      g.appendChild(card);
    });
  }

  function recalcRates(){
    // perClick from base + additive upgrades, then multiplicative
    let base = 1;
    let mult = 1;
    UPG.forEach(u=>{
      const owned = S.upgrades[u.id]||0;
      if(u.add) base += u.add*owned;
      if(u.mult) mult *= Math.pow(u.mult, owned);
    });
    S.perClick = Math.max(1, Math.floor(base*mult));

    // perSecond from autos
    let ps = 0;
    AUTOS.forEach(a=>{ ps += (S.autos[a.id]||0) * a.bps; });
    S.perSecond = ps;
  }

  function updateHUD(){
    biryaniOut.textContent = `${currency(S.biryani)}\u00A0🍗`;
    totalOut.textContent = fmt(S.total);
    perClickOut.textContent = `${fmt(currentClickPower())}`;
    perSecOut.textContent = `${fmt(S.perSecond)}`;

    // Enable/disable buy buttons based on affordability
    document.querySelectorAll('[data-upg]').forEach(btn=>{
      const id = btn.getAttribute('data-upg');
      const def = UPG.find(u=>u.id===id);
      const cost = upgradeCost(def.base, S.upgrades[id]||0);
      btn.disabled = S.biryani < cost;
    });
    document.querySelectorAll('[data-auto]').forEach(btn=>{
      const id = btn.getAttribute('data-auto');
      const def = AUTOS.find(a=>a.id===id);
      const cost = upgradeCost(def.base, S.autos[id]||0);
      btn.disabled = S.biryani < cost;
    });

    // Spice burst button cost + status
    const sbCost = spiceBurstCost();
    el('#spiceBurstBtn').textContent = `🌶️ Spice Burst (${currency(sbCost)})`;
  }

  function currentClickPower(){
    const dblActive = Date.now() < S.doubleClickUntil;
    return dblActive ? S.perClick*2 : S.perClick;
  }

  function addBiryani(n){
    S.biryani += n; S.total += n; updateHUD();
  }

  function floatText(text){
    const span = document.createElement('div');
    span.className='float';
    span.textContent = text;
    span.style.left = '50%';
    span.style.top = '50%';
    floatLayer.appendChild(span);
    setTimeout(()=> span.remove(), 800);
  }

  function onClickCook(){
    // Small chance of "Zafrani Critical" 5x
    const crit = Math.random() < 0.04;
    const amt = currentClickPower() * (crit ? 5 : 1);
    addBiryani(amt);
    floatText(`+${fmt(amt)}${crit?' ✨':''}`);
    // little bop
    const handi = document.getElementById('handi');
    handi.style.transform = 'translateY(14%) scale(.96)';
    setTimeout(()=>{handi.style.transform = '';}, 60);
  }

  // Buying
  function buyUpgrade(id){
    const def = UPG.find(u=>u.id===id);
    const owned = S.upgrades[id]||0;
    const cost = upgradeCost(def.base, owned);
    if(S.biryani >= cost){
      S.biryani -= cost;
      S.upgrades[id] = owned+1;
      recalcRates();
      updateHUD();
      renderUpgrades(); // update costs/owned display
    }
  }
  function buyAuto(id){
    const def = AUTOS.find(a=>a.id===id);
    const owned = S.autos[id]||0;
    const cost = upgradeCost(def.base, owned);
    if(S.biryani >= cost){
      S.biryani -= cost;
      S.autos[id] = owned+1;
      recalcRates();
      updateHUD();
      renderAutos();
    }
  }

  // Spice Burst: temporary double click power for 10s. Cost scales steeply.
  function spiceBurstCost(){
    const base = 500; // starting cost
    return Math.ceil(base * Math.pow(2.25, S.spiceBurstLevel));
  }
  function activateSpiceBurst(){
    const cost = spiceBurstCost();
    if(S.biryani < cost) return;
    S.biryani -= cost;
    S.spiceBurstLevel++;
    const now = Date.now();
    S.doubleClickUntil = Math.max(S.doubleClickUntil, now) + 10000; // extend if active
    statusMsg.textContent = '🌶️ Spice Burst active! Double clicks for 10s';
    setTimeout(()=>{ if(Date.now()>S.doubleClickUntil){ statusMsg.textContent=''; } }, 10050);
    updateHUD();
  }

  // Ticking & offline progress
  function tick(){
    const now = Date.now();
    const dt = Math.max(0, now - S.lastTick) / 1000; // seconds
    S.lastTick = now;
    const add = S.perSecond * dt;
    if(add>0){ S.biryani += add; S.total += add; updateHUD(); }
  }
  function grantOfflineProgress(){
    const now = Date.now();
    const dt = Math.min(3600*6, Math.max(0, (now - S.lastTick)/1000)); // cap 6h
    const add = S.perSecond * dt;
    if(add>0){
      S.biryani += add; S.total += add;
      statusMsg.textContent = `Welcome back! +${fmt(add)} from slow-cook.`;
      setTimeout(()=> statusMsg.textContent='', 6000);
    }
    S.lastTick = now;
  }

  // Save/Load
  function save(){ localStorage.setItem('biryaniClickerSaveV1', JSON.stringify(S)); }
  function load(){
    try{
      const raw = localStorage.getItem('biryaniClickerSaveV1');
      if(!raw) return null;
      const data = JSON.parse(raw);
      // basic shape check
      if(typeof data!== 'object' || data===null) return null;
      return data;
    }catch(e){ return null; }
  }
  function resetAll(){
    if(!confirm('Reset all progress?')) return;
    S = structuredClone(defaultState);
    recalcRates();
    renderUpgrades();
    renderAutos();
    updateHUD();
    save();
  }

  // Event listeners
  cookBtn.addEventListener('click', onClickCook);
  document.addEventListener('keydown', (e)=>{ if(e.key===' ') { e.preventDefault(); onClickCook(); }});
  grid('upgradesGrid').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-upg]'); if(b) buyUpgrade(b.getAttribute('data-upg'));
  });
  grid('autoGrid').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-auto]'); if(b) buyAuto(b.getAttribute('data-auto'));
  });
  el('#spiceBurstBtn').addEventListener('click', activateSpiceBurst);
  el('#saveBtn').addEventListener('click', ()=>{ save(); statusMsg.textContent='Saved!'; setTimeout(()=>statusMsg.textContent='',1200); });
  el('#resetBtn').addEventListener('click', resetAll);
  el('#exportBtn').addEventListener('click', ()=>{
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    navigator.clipboard?.writeText(data);
    alert('Save data copied to clipboard! Keep it safe.');
  });
  el('#importBtn').addEventListener('click', async ()=>{
    const data = prompt('Paste your save data:');
    if(!data) return;
    try{
      const parsed = JSON.parse(decodeURIComponent(escape(atob(data))));
      if(parsed && typeof parsed==='object'){
        S = Object.assign(structuredClone(defaultState), parsed);
        recalcRates(); renderUpgrades(); renderAutos(); updateHUD(); save();
        alert('Imported!');
      }
    }catch(err){ alert('Invalid save data.'); }
  });

  // Init
  renderUpgrades();
  renderAutos();
  recalcRates();
  grantOfflineProgress();
  updateHUD();

  // Game loop
  setInterval(tick, 250);
  setInterval(save, 10000); // autosave every 10s
})();
</script></body>
  </html>
